<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>수열의 극한 시각화 프로그램</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>

<style>

/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        Arial,
        sans-serif;

    background: #f4f6f9;
    color: #222;

    line-height: 1.5;

    overflow-x: hidden;
}


/* =========================
   전체 컨테이너
========================= */

.container {
    width: 94%;
    max-width: 1250px;

    margin: 30px auto;
}


/* =========================
   제목
========================= */

h1 {
    text-align: center;

    font-size: 32px;

    margin: 0 0 8px 0;

    white-space: nowrap;
}

.subtitle {
    text-align: center;

    color: #666;

    font-size: 16px;

    margin: 0 0 28px 0;
}


/* =========================
   메인 영역
========================= */

.main {
    display: grid;

    grid-template-columns:
        minmax(280px, 330px)
        minmax(0, 1fr);

    gap: 22px;

    align-items: stretch;
}


/* =========================
   카드
========================= */

.panel,
.graph-panel,
.result {
    background: white;

    border-radius: 15px;

    padding: 24px;

    box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.08);
}


/* =========================
   입력 패널
========================= */

.panel h2,
.graph-panel h2,
.result h2 {
    margin-top: 0;

    margin-bottom: 18px;

    font-size: 21px;

    white-space: nowrap;
}


/* =========================
   입력 제목
========================= */

label {
    display: block;

    width: 100%;

    font-size: 15px;

    font-weight: bold;

    margin-top: 18px;

    margin-bottom: 7px;

    white-space: nowrap;
}


/* =========================
   입력창
========================= */

input {
    display: block;

    width: 100%;

    height: 46px;

    padding: 10px 12px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    background: white;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    font-size: 16px;

    color: #222;

    outline: none;
}

input:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 2px rgba(37, 99, 235, 0.12);
}


/* =========================
   버튼
========================= */

button {
    display: block;

    width: 100%;

    height: 48px;

    margin-top: 22px;

    padding: 0 15px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-family:
        "Malgun Gothic",
        Arial,
        sans-serif;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;
}

button:hover {
    background: #1d4ed8;
}


/* =========================
   예시 박스
========================= */

.examples {
    width: 100%;

    margin-top: 20px;

    padding: 14px;

    background: #f1f5f9;

    border-radius: 8px;

    font-size: 14px;

    line-height: 1.8;

    overflow-wrap: break-word;
}

.examples strong {
    display: block;

    margin-bottom: 4px;
}


/* =========================
   그래프 영역
========================= */

.graph-panel {
    min-width: 0;
}

.chart-container {
    position: relative;

    width: 100%;

    height: 450px;

    min-width: 0;
}

#sequenceChart {
    display: block;

    width: 100% !important;

    height: 100% !important;
}


/* =========================
   결과 영역
========================= */

.result {
    margin-top: 22px;

    width: 100%;
}

.result p {
    margin: 12px 0;

    font-size: 16px;

    white-space: normal;

    word-break: keep-all;
}


/* =========================
   수열식 표시
========================= */

.formula {
    width: 100%;

    padding: 14px;

    background: #f8fafc;

    border-radius: 8px;

    font-family:
        "Courier New",
        monospace;

    font-size: 16px;

    overflow-x: auto;

    white-space: nowrap;
}


/* =========================
   판정 결과
========================= */

#status {
    font-size: 21px;

    font-weight: bold;

    margin-top: 18px;

    margin-bottom: 18px;

    white-space: normal;

    word-break: keep-all;
}

.convergent {
    color: #15803d;
}

.divergent {
    color: #dc2626;
}

.unknown {
    color: #d97706;
}


/* =========================
   결과 숫자
========================= */

#limit,
#lastTerm,
#difference {
    font-weight: bold;

    font-family:
        "Courier New",
        monospace;

    word-break: normal;
}


/* =========================
   태블릿
========================= */

@media (max-width: 900px) {

    .main {
        grid-template-columns: 280px minmax(0, 1fr);
    }

    h1 {
        font-size: 28px;
    }

    .chart-container {
        height: 400px;
    }
}


/* =========================
   휴대폰
========================= */

@media (max-width: 700px) {

    .container {
        width: 94%;

        margin: 20px auto;
    }

    h1 {
        font-size: 24px;

        white-space: normal;

        word-break: keep-all;
    }

    .subtitle {
        font-size: 14px;

        word-break: keep-all;
    }

    .main {
        display: flex;

        flex-direction: column;
    }

    .panel,
    .graph-panel,
    .result {
        width: 100%;

        padding: 20px;
    }

    .chart-container {
        height: 350px;
    }

    .panel h2,
    .graph-panel h2,
    .result h2 {
        white-space: normal;
    }
}

</style>
</head>


<body>


<div class="container">


    <!-- =========================
         제목
    ========================== -->

    <h1>
        수열의 극한 시각화 프로그램
    </h1>

    <p class="subtitle">
        수열의 식을 입력하면 항을 계산하고 그래프와 극한값을 확인할 수 있습니다.
    </p>


    <!-- =========================
         입력 + 그래프
    ========================== -->

    <div class="main">


        <!-- 입력 -->
        <div class="panel">

            <h2>수열 입력</h2>


            <label for="sequence">
                수열식 aₙ =
            </label>

            <input
                id="sequence"
                type="text"
                value="1/n"
                placeholder="예: 1/n"
            >


            <label for="startN">
                시작 n값
            </label>

            <input
                id="startN"
                type="number"
                value="1"
                min="1"
            >


            <label for="termCount">
                항의 개수
            </label>

            <input
                id="termCount"
                type="number"
                value="100"
                min="2"
                max="10000"
            >


            <button onclick="calculateSequence()">
                수열 계산하기
            </button>


            <div class="examples">

                <strong>입력 예시</strong>

                1/n<br>

                n/(n+1)<br>

                1/n^2<br>

                (-1)^n<br>

                2^n<br>

                sin(n)/n<br>

                (n+1)/(2*n)

            </div>

        </div>


        <!-- 그래프 -->
        <div class="graph-panel">

            <h2>수열 그래프</h2>

            <div class="chart-container">

                <canvas id="sequenceChart"></canvas>

            </div>

        </div>

    </div>


    <!-- =========================
         결과
    ========================== -->

    <div class="result">

        <h2>판정 결과</h2>


        <div class="formula">

            입력한 수열:
            <span id="formulaText">
                aₙ = 1/n
            </span>

        </div>


        <p
            id="status"
            class="unknown"
        >
            계산 결과가 여기에 표시됩니다.
        </p>


        <p>
            추정 극한값:
            <span id="limit">-</span>
        </p>


        <p>
            마지막 항:
            <span id="lastTerm">-</span>
        </p>


        <p>
            마지막 두 항의 차이:
            <span id="difference">-</span>
        </p>

    </div>

</div>


<script>


/* =========================
   전역 변수
========================= */

let chart = null;


/* =========================
   수열 계산
========================= */

function calculateSequence() {

    const expression =
        document
        .getElementById("sequence")
        .value
        .trim();


    const startN =
        parseInt(
            document
            .getElementById("startN")
            .value
        );


    const termCount =
        parseInt(
            document
            .getElementById("termCount")
            .value
        );


    if (!expression) {

        alert("수열식을 입력해주세요.");

        return;
    }


    if (
        isNaN(startN) ||
        startN < 1
    ) {

        alert("시작 n값을 올바르게 입력해주세요.");

        return;
    }


    if (
        isNaN(termCount) ||
        termCount < 2
    ) {

        alert("항의 개수를 2개 이상 입력해주세요.");

        return;
    }


    document
    .getElementById("formulaText")
    .textContent =
        "aₙ = " + expression;


    const nValues = [];

    const terms = [];


    /* 수열 계산 */

    for (
        let i = 0;
        i < termCount;
        i++
    ) {

        const n =
            startN + i;


        try {

            const value =
                math.evaluate(
                    expression,
                    { n: n }
                );


            if (
                typeof value !== "number" ||
                !Number.isFinite(value)
            ) {

                terms.push(null);

            } else {

                terms.push(value);

            }


            nValues.push(n);


        } catch (error) {

            alert(
                "수열식을 계산할 수 없습니다.\n\n" +
                "예:\n" +
                "1/n\n" +
                "n/(n+1)\n" +
                "(-1)^n"
            );

            return;
        }

    }


    /* 그래프 */

    drawChart(
        nValues,
        terms
    );


    /* 극한 분석 */

    analyzeLimit(terms);

}


/* =========================
   그래프
========================= */

function drawChart(
    nValues,
    terms
) {

    const canvas =
        document
        .getElementById("sequenceChart");


    const ctx =
        canvas.getContext("2d");


    if (chart !== null) {

        chart.destroy();

    }


    chart =
        new Chart(
            ctx,
            {

                type: "line",

                data: {

                    labels: nValues,

                    datasets: [

                        {

                            label: "aₙ",

                            data: terms,

                            borderWidth: 2,

                            pointRadius: 2,

                            pointHoverRadius: 5,

                            tension: 0.1

                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio: false,


                    scales: {

                        x: {

                            title: {

                                display: true,

                                text: "n"

                            }

                        },


                        y: {

                            title: {

                                display: true,

                                text: "aₙ"

                            }

                        }

                    },


                    plugins: {

                        legend: {

                            display: true

                        }

                    }

                }

            }
        );

}


/* =========================
   극한 분석
========================= */

function analyzeLimit(terms) {

    const validTerms =
        terms.filter(
            value =>
                value !== null &&
                Number.isFinite(value)
        );


    if (
        validTerms.length < 10
    ) {

        showResult(
            "판정할 수 없습니다.",
            null,
            null,
            null,
            "unknown"
        );

        return;
    }


    const checkCount =
        Math.min(
            20,
            Math.floor(
                validTerms.length * 0.2
            )
        );


    const recent =
        validTerms.slice(
            -checkCount
        );


    const last =
        validTerms[
            validTerms.length - 1
        ];


    const previous =
        validTerms[
            validTerms.length - 2
        ];


    const difference =
        Math.abs(
            last - previous
        );


    const average =
        recent.reduce(
            (sum, value) =>
                sum + value,
            0
        ) / recent.length;


    const max =
        Math.max(...recent);


    const min =
        Math.min(...recent);


    const range =
        Math.abs(
            max - min
        );


    const tolerance =
        Math.max(
            0.000001,
            Math.abs(average) * 0.0001
        );


    /* 수렴 */

    if (
        range < tolerance * 10 &&
        difference < tolerance
    ) {

        showResult(

            "이 수열은 수렴하는 것으로 판단됩니다.",

            average,

            last,

            difference,

            "convergent"

        );

    }


    /* 매우 큰 값 */

    else if (
        Math.abs(last) > 1e10
    ) {

        showResult(

            "이 수열은 발산하는 것으로 판단됩니다.",

            null,

            last,

            difference,

            "divergent"

        );

    }


    /* 아직 변화가 큰 경우 */

    else {

        const firstRecent =
            recent[0];


        const lastRecent =
            recent[
                recent.length - 1
            ];


        const change =
            Math.abs(
                lastRecent -
                firstRecent
            );


        if (
            change >
            Math.max(
                0.01,
                Math.abs(average) * 0.01
            )
        ) {

            showResult(

                "이 수열은 발산하거나 아직 수렴하지 않은 것으로 판단됩니다.",

                null,

                last,

                difference,

                "divergent"

            );

        } else {

            showResult(

                "수렴 가능성이 있지만 더 많은 항의 계산이 필요합니다.",

                average,

                last,

                difference,

                "unknown"

            );

        }

    }

}


/* =========================
   결과 출력
========================= */

function showResult(
    status,
    limit,
    last,
    difference,
    className
) {

    const statusElement =
        document
        .getElementById("status");


    statusElement.textContent =
        status;


    statusElement.className =
        className;


    if (
        limit !== null
    ) {

        document
        .getElementById("limit")
        .textContent =
            formatNumber(limit);

    } else {

        document
        .getElementById("limit")
        .textContent =
            "∞ 또는 존재하지 않음";

    }


    if (
        last !== null
    ) {

        document
        .getElementById("lastTerm")
        .textContent =
            formatNumber(last);

    }


    if (
        difference !== null
    ) {

        document
        .getElementById("difference")
        .textContent =
            formatNumber(difference);

    }

}


/* =========================
   숫자 표시
========================= */

function formatNumber(value) {

    if (
        Math.abs(value) < 0.000001
    ) {

        return value.toExponential(4);

    }


    if (
        Math.abs(value) > 1000000
    ) {

        return value.toExponential(4);

    }


    return value
        .toFixed(8)
        .replace(/0+$/, "")
        .replace(/\.$/, "");

}


/* =========================
   처음 실행
========================= */

window.onload =
    function() {

        calculateSequence();

    };


</script>

</body>
</html>
